name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out code
  #       uses: actions/checkout@v4
  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #     - name: Install dependencies
  #       env:
  #         FEBIO_URL: ${{ secrets.FEBIO_URL }}
  #       run: |
  #         curl -L "$FEBIO_URL" --output FEBio4.tar.gz
  #         tar -xvf FEBio4.tar.gz
  #         echo "$GITHUB_WORKSPACE/FEBio4/bin/" >> $GITHUB_PATH
  #         pip install pytest
  #         pip install .

  #     - name: Test and Coverage
  #       run: python -m pytest
  build-docs:
    runs-on: ubuntu-latest
    # needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          pip install . --group dev
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Sphinx build
        run: |
          sphinx-build docs _build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload docs build directory
          path: "_build/"
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # needs: [test, build-docs]
    needs: [build-docs]
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  publish:
    # needs: [test, build-docs, deploy-docs]
    needs: [build-docs, deploy-docs]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
